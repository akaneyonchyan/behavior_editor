          keys=['FEISHU_APP_ID','FEISHU_APP_SECRET','FEISHU_BASE_TOKEN','FEISHU_OBJECT_TABLE','FEISHU_ATTRIBUTE_TABLE','FEISHU_BUFF_TABLE']
          if any(not os.environ.get(k) for k in keys):raise SystemExit('Missing required library configuration')
          pathlib.Path('recipient.pem').write_text(os.environ['RECIPIENT_CERT'])
          payload=json.dumps({k:os.environ[k] for k in keys}).encode()
          subprocess.run(['openssl','cms','-encrypt','-binary','-aes-256-cbc','-outform','DER','-out','library-secrets.p7m','recipient.pem'],input=payload,check=True)
          print('Encrypted configuration for the cloud server; no plaintext files created.')
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-library-configuration
          path: library-secrets.p7m
          retention-days: 1
          if-no-files-found: error
