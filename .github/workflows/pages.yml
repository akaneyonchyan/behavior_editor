name: Publish editor and public library
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'schedule' || vars.CONTENT_LIBRARY_SOURCE == 'feishu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Validate shared behavior files
        run: node scripts/validate-behaviors.mjs
      - name: Verify runner Chrome for browser regression tests
        if: github.event_name != 'schedule'
        run: google-chrome --version
      - name: Read and validate Feishu rows
        if: vars.CONTENT_LIBRARY_SOURCE == 'feishu'
        run: node scripts/export-public-library.mjs
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BASE_TOKEN: ${{ secrets.FEISHU_BASE_TOKEN }}
          FEISHU_OBJECT_TABLE: ${{ secrets.FEISHU_OBJECT_TABLE }}
          FEISHU_ATTRIBUTE_TABLE: ${{ secrets.FEISHU_ATTRIBUTE_TABLE }}
          FEISHU_BUFF_TABLE: ${{ secrets.FEISHU_BUFF_TABLE }}
      - name: Prepare checked-in library and behavior resources
        if: vars.CONTENT_LIBRARY_SOURCE != 'feishu'
        run: node scripts/prepare-github.mjs
      - name: Prepare newly configured Feishu library and behavior resources
        if: vars.CONTENT_LIBRARY_SOURCE == 'feishu'
        run: node scripts/prepare-github.mjs public/data/library.json
      - name: Validate public library before publishing
        run: node scripts/validate-public-library.mjs
      - name: Export public behavior files
        run: node scripts/export-behaviors.mjs
      - name: Test editor and behavior simulation with published snapshots
        run: npm test
      - name: Verify complete backup resources and fishing graph
        run: node tests/github-resources.mjs
      - name: Verify editor and preview in browser
        if: github.event_name != 'schedule'
        run: npm run test:browser
        env:
          PW_CHANNEL: chrome
      - name: Build read-only editor
        run: npm run build
        env:
          VITE_LIBRARY_MODE: published
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Verify GitHub production website with bundled behaviors
        if: github.event_name != 'schedule'
        run: npx playwright test --config playwright.github.config.cjs
        env:
          PW_CHANNEL: chrome
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
