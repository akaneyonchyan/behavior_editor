services:
  editor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${EDITOR_IMAGE:-behavior-editor:snapshot}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5110:5110"
    environment:
      PREVIEW_ORIGIN: "http://localhost:5110"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
