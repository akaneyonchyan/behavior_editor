# Install after the real certificate, cloud network and login configuration are ready.
# All resources must pass through authentication; never add static data aliases.
server {
    listen 443 ssl;
    server_name behavior-editor.online;
    ssl_certificate /etc/letsencrypt/live/behavior-editor.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/behavior-editor.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/behavior-editor-error.log crit;
    client_max_body_size 1m;
    error_page 502 504 =503 @setup;
    location @setup {
        default_type text/html;
        charset utf-8;
        return 503 '<!doctype html><meta charset="utf-8"><title>行为编辑器</title><h1>行为编辑器正在完成登录配置</h1><p>请稍后再试。当前尚未开放编辑器和在线文件。</p>';
    }
    location = /healthz { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5111;
        proxy_set_header Host behavior-editor.online;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }
}
